[package]
name = "molt-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "molt-gui"
path = "src/main.rs"

# 界面主体编译成库，`src/bin/shots.rs` 才能用同一份界面代码出图。
[lib]
name = "molt_gui"
path = "src/lib.rs"

[dependencies]
molt-core.workspace = true
molt-safety.workspace = true
molt-scan.workspace = true
molt-act.workspace = true
molt-rules.workspace = true
molt-ai.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "persistence",
] }
egui = "0.37"
png = "0.18"
plist = "1.10.3"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
